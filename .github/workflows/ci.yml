name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Coverage · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Enable Corepack (packageManager pin)
        run: corepack enable

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time placeholders (no real secrets in CI)
          # The E2E server later starts a loopback-only readiness RPC fixture.
          # NEXT_PUBLIC values are baked into this build, so use that URL here.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          BEACON_FEEDBACK_TO: owner@beacon.local
          RESEND_API_KEY: re_test_key
          EMAIL_FROM: Beacon <hello@beacon.test>

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E public smoke
        run: npm run test:e2e
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key

  database-security:
    name: Database RLS authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start disposable Supabase database
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verify role and tenant boundaries
        run: supabase test db supabase/tests --local

      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
